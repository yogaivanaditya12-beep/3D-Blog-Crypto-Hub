<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACKOUT // 3D Personal Hub</title>
  <link rel="icon" href="logo.JPG?v=3" type="image/jpeg">
  <style>
    :root {
      --bg-color: #050505;
      --card-bg: rgba(18, 18, 18, 0.7);
      --border-color: rgba(255, 255, 255, 0.12);
      --border-hover: rgba(255, 255, 255, 0.8);
      --text-primary: #ffffff;
      --text-secondary: #888888;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* 3D Canvas Background */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Container Layout */
    .container {
      position: relative;
      z-index: 2;
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    /* Profile Card (Monochrome Glassmorphism) */
    .profile-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      margin-bottom: 50px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      transition: border-color 0.4s ease;
    }

    .profile-card:hover {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .avatar-box {
      width: 75px;
      height: 75px;
      margin: 0 auto 20px;
      border-radius: 50%;
      border: 1px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      background: #000000;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .bio {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      max-width: 500px;
      margin: 0 auto 30px;
      letter-spacing: 0.5px;
    }

    /* Social Buttons Grid */
    .social-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }

    .social-btn {
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .social-btn:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
    }

    /* Blog Section Header */
    .section-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 25px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    /* Blog Cards */
    .blog-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .blog-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 28px;
      transition: all 0.4s ease;
      text-decoration: none;
      color: inherit;
      display: block;
      position: relative;
    }

    .blog-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    .blog-tag {
      font-size: 0.7rem;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
      display: inline-block;
      border-bottom: 1px solid #ffffff;
      padding-bottom: 2px;
    }
